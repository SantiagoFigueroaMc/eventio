<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventio</title>
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <button class="project-picker" type="button" aria-haspopup="dialog">
            <span class="project-picker-label"></span>
        </button>
        <span class="element-counter"></span>
    </header>
    <main class="layout">
        <section class="panel explorer" aria-label="Explorer">
            <details class="pages" open>
                <summary>
                    <span class="pages-title">
                        <span class="pages-toggle-icon" aria-hidden="true">›</span>
                        <b>Pages</b>
                    </span>
                    <button class="add-page" type="button">Add</button>
                </summary>
                <div class="page-list"></div>
            </details>
        </section>
        <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize explorer panel" tabindex="0"></div>
        <section class="panel main" aria-label="Main content">
            <button class="toggle-image-buttons" type="button" aria-label="Hide image buttons" aria-pressed="false">
                <span class="toggle-image-buttons-icon" aria-hidden="true"></span>
            </button>
            <div class="empty-state">
                <div class="upload-icon" aria-hidden="true">↑</div>
                <h1>Add an image</h1>
                <p>Drag and drop an image here, or choose a file to start placing buttons.</p>
                <label class="file-button">
                    Upload image
                    <input class="image-input" type="file" accept="image/*">
                </label>
            </div>
            <div class="canvas" hidden>
                <img class="page-image" alt="">
                <div class="image-buttons"></div>
            </div>
        </section>
        <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize main content panel" tabindex="0"></div>
        <section class="panel details" aria-label="Selected element editor">
            <div class="event-content">
                <h2 class="event-heading">Editor</h2>
                <p class="no-selection">Select a page, button, or event.</p>
                <div class="editor-form"></div>
            </div>
        </section>
    </main>
    <dialog class="project-modal" aria-labelledby="project-modal-title">
        <div class="project-modal-content">
            <header class="project-modal-header">
                <h2 id="project-modal-title">Projects</h2>
                <button class="close-project-modal" type="button" aria-label="Close projects">×</button>
            </header>
            <div class="project-list"></div>
            <div class="project-modal-actions">
                <button class="project-action create-project" type="button">
                    <span class="project-action-icon" data-icon="add" aria-hidden="true"></span>
                    <span>Create</span>
                </button>
            </div>
        </div>
    </dialog>
    <script type="module" src="main.js"></script>
</body>
</html>
